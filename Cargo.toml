[workspace]
resolver = "2"
members = [
    "src-tauri",
]

[workspace.dependencies]
# Core
tokio = { version = "1.40", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP / Proxy
hyper = { version = "1.0", features = ["full", "http2", "rustls"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["std", "dangerous_configuration", "pem"] }
rustls-pemfile = "1.0"
rcgen = "0.11"
h2 = "0.4"
tokio-rustls = "0.26"
tokio-native-tls = "0.3"

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["rustls-tls", "native-tls"] }
tungstenite = "0.21"

# Storage
sled = "0.34"
redb = "1.0"

# Sandbox
wasmtime = { version = "25.0", features = ["cranelift", "wasm-backtrace"] }
wasmparser = "0.215"
wasi = "0.11"

# Tauri
tauri = { version = "2.0", features = ["tray-icon", "global-shortcut", "clipboard-manager", "fs", "dialog", "shell", "process", "updater", "webview", "window-state"] }
tauri-plugin-store = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-webview = "2.0"
tauri-plugin-window-state = "2.0"

# Utils
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14"
notify = "6.1"
walkdir = "2.0"
ignore = "0.13"
glob = "0.3"
regex = "1.0"
lazy_static = "1.4"
parking_lot = "0.12"
dashmap = "5.5"
crossbeam = "0.8"
flume = "0.11"
bytes = "1.0"
mime = "0.3"
url = "2.0"
percent-encoding = "2.3"
base64 = "0.22"
hex = "0.4"

# Testing
tempfile = "3.0"
predicates = "3.0"
wiremock = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
debug = true
opt-level = 0